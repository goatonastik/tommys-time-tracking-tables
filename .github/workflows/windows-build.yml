name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify
        shell: pwsh
        run: ./build.ps1
      - name: Package portable Windows app
        shell: pwsh
        run: ./publish.ps1
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: Tommys-Time-Tracking-Tables-win-x64
          path: artifacts/release/Tommys-Time-Tracking-Tables-win-x64.zip
          if-no-files-found: error
      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-previews
          path: artifacts/tests/*-preview.png
          if-no-files-found: ignore
